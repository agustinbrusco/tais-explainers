[project]
name = "tais-explainers"
version = "0.1.0"
description = "Animated, rigorous explainers for Technical AI Safety concepts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "imageio-ffmpeg>=0.5",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Needs system headers: sudo apt install libcairo2-dev libpango1.0-dev pkg-config
manim = [
    "manim>=0.19",
]
# Real-model activations for "real data" visuals. CPU-only torch (no GPU here).
interp = [
    "torch>=2.4",
    "transformer-lens>=2.0",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit"]
