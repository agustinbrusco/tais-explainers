# Narration for probes. Render: uv run scripts/tts.py projects/probes/narration.yaml --preview
# Write for the ear: short sentences, one idea each, no parentheses, no symbols.
# `say:` (optional) overrides what is spoken while `text` stays the caption.
voice: am_michael
lang: en-us
speed: 1.0
segments:
  - id: hook
    text: >
      A language model never writes down most of what it computes.
  - id: idea
    text: >
      But every position carries a hidden vector, and if we point the right lens at it,
      we can read what the model is about to say before it says it.
