- id: arxiv:2608.08888
  title: Full-bandwidth transformer
  authors:
  - Xi Wang
  - Ziyang Cai
  - Zheng Zhan
  - Harry Dong
  - Ying Fan
  - Gustavo de Rosa
  - Tim Pearce
  - John Langford
  date: '2026-08-09'
  url: https://arxiv.org/abs/2608.08888
  abstract: 'Autoregressive transformers compute along two axes: horizontally across generated tokens,
    and vertically through model depth. Dense attention gives each token broad horizontal access to the
    past, but the vertical feedback channel between decoding steps remains narrow: only the sampled token
    returns to the bottom of the stack, while the top-layer hidden state is discarded. We introduce the
    \emph{full-bandwidth transformer}, which widens this channel with \emph{latent feedback}: at each
    decoding step, the previous top-layer hidden state is fused with the sampled token embedding through
    a gated linear unit and fed back as the next input. Latent feedback lets non-verbalized computation
    re-enter the stack with a renewed depth budget, while preserving the standard transformer architecture,
    KV cache, and language-modeling objective. To train full-bandwidth transformers without losing parallel
    teacher forcing, we use a scheduled multi-pass objective that introduces latent feedback late in pretraining
    and mixes a small fraction of deeper feedback passes for stability. We train 1B-parameter full-bandwidth
    transformers up to 400B tokens and find that latent feedback improves validation loss, 5-shot language-model
    evaluation, math and coding generation, and instruction-tuned performance. With negligible per-token
    decoding overhead, full-bandwidth transformers match or approach standard transformers trained with
    roughly $1.5\times$ more tokens, and manage to produce shorter reasoning traces at equal or better
    accuracy.'
  read: false
  notes: ''
- id: arxiv:2609.19101
  title: Monitoring and Discovering Reward Hacking with Internal Representations during LLM Evaluations
  authors:
  - Leon Bergen
  - Usha Bhalla
  - Andrew Lee
  - Barak Widawsky
  - Linas Nasvytis
  - Connor Watts
  - Siddharth Boppana
  - Sidharth Baskaran
  - Dron Hazra
  - Michael Byun
  - Atticus Geiger
  - Owen Lewis
  - Matthew Kowal
  - Vasudev Shyam
  - Thomas Fel
  - Thomas McGrath
  - Ekdeep Singh Lubana
  - Jack Merullo
  date: '2026-09-16'
  url: https://arxiv.org/abs/2609.19101
  abstract: As models scale, reward hacking becomes more frequent, more sophisticated, and more consequential.
    Does it leave a telltale signature in model representations? This work analyzes how reward hacking
    is represented internally in frontier open source LLMs, and how those representations can be used
    to understand and discover the range of hacking behaviors a model displays. In particular, we find
    that simple difference of means vectors coherently represent reward hacking in Kimi K3, GLM 5.2, and
    Qwen 3.8 Max across a variety of behaviors in common evaluations. Despite their simplicity, these
    vectors are both generalizable and interpretable, and we can use them to reliably detect reward hacking.
    We first evaluate reward hacking in commonly reported benchmarks like DeepSWE and SWE-bench, finding
    that models reward hack excessively in these environments; GLM 5.2 hacks in 57.2% of rollouts on DeepSWE
    and in 73% of rollouts on SWE-bench. Catching these requires monitors; LLM monitors are effective,
    but expensive detectors. We show that DoM vectors are similarly effective but virtually free, catching
    3.1% more hacks in Kimi K3 and 7.9% fewer hacks in GLM 5.2 on DeepSWE at a monitor matched false positive
    rate. DoM vectors run on the chain-of-thought also predict reward hacks in the model's subsequent
    actions, meaning we can run them online and catch potential hacks before they occur. Finally, we analyze
    probe-hits that LLM monitors do not catch and discover other undesirable behaviors, as well as show
    transfer to finding hacks in non-SWE evaluations. Together, these results provide evidence that simple,
    white-box methods can be used to scalably study and monitor reward hacking behaviors in frontier open
    source models
  read: false
  notes: ''
