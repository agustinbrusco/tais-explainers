    comparison Table 3: probe weight 34.8 vs mass-mean 42.3 True*Info (L391-397), App. B (L4420-4423);
    Alpaca 32.5 -> 65.1 True*Info (L380-381); trade-off (L343-344). The ''40%'' probe-generation gap (L67-68)
