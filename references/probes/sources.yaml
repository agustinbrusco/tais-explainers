    L355-357); fragility two layers later (L359-361); scenario confound (L363-365, L549-551); failure
    modes (L460-466); verdict (L31-32, L52-53); viewer data.apolloresearch.ai/dd/.'
- id: arxiv:2506.10805
  title: Detecting High-Stakes Interactions with Activation Probes
  authors:
  - Alex McKenzie
  - Urja Pawar
  - Phil Blandfort
  - William Bankes
  - David Krueger
  - Ekdeep Singh Lubana
  - Dmitrii Krasheninnikov
  date: '2025-06-12'
  url: https://arxiv.org/abs/2506.10805
  abstract: Monitoring is an important aspect of safely deploying Large Language Models (LLMs). This paper
    examines activation probes for detecting ``high-stakes'' interactions -- where the text indicates
    that the interaction might lead to significant harm -- as a critical, yet underexplored, target for
    such monitoring. We evaluate several probe architectures trained on synthetic data, and find them
    to exhibit robust generalization to diverse, out-of-distribution, real-world data. Probes' performance
    is comparable to that of prompted or finetuned medium-sized LLM monitors, while offering computational
    savings of six orders-of-magnitude. These savings are enabled by reusing activations of the model
    that is being monitored. Our experiments also highlight the potential of building resource-aware hierarchical
    monitoring systems, where probes serve as an efficient initial filter and flag cases for more expensive
    downstream analysis. We release our novel synthetic dataset and the codebase at https://github.com/arrrlex/models-under-pressure.
