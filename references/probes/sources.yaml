- id: arxiv:2310.02207
  title: Language Models Represent Space and Time
  authors:
  - Wes Gurnee
  - Max Tegmark
  date: '2023-10-03'
  url: https://arxiv.org/abs/2310.02207
  abstract: The capabilities of large language models (LLMs) have sparked debate over whether such systems
    just learn an enormous collection of superficial statistics or a set of more coherent and grounded
    representations that reflect the real world. We find evidence for the latter by analyzing the learned
    representations of three spatial datasets (world, US, NYC places) and three temporal datasets (historical
    figures, artworks, news headlines) in the Llama-2 family of models. We discover that LLMs learn linear
    representations of space and time across multiple scales. These representations are robust to prompting
    variations and unified across different entity types (e.g. cities and landmarks). In addition, we
    identify individual "space neurons" and "time neurons" that reliably encode spatial and temporal coordinates.
    While further investigation is needed, our results suggest modern LLMs learn rich spatiotemporal representations
    of the real world and possess basic ingredients of a world model.
  read: partial
  notes: Relevant sections read and quotes grep-checked against papers/2310.02207.txt on 2026-09-26 (research
    agent + reading sub-agents). Ridge probes on last entity token, Llama-2 7B-70B; MLP 'minimal improvement'
    (L207-209, Table 2 L255-263; MLP sometimes worse); held-out blocks (L302-305); caveats (L154, L277-278,
    L357-358); English-Wikipedia skew (L693-694).
- id: arxiv:2405.14860
  title: Not All Language Model Features Are One-Dimensionally Linear
  authors:
  - Joshua Engels
  - Eric J. Michaud
  - Isaac Liao
  - Wes Gurnee
  - Max Tegmark
  date: '2024-05-23'
  url: https://arxiv.org/abs/2405.14860
  abstract: Recent work has proposed that language models perform computation by manipulating one-dimensional
    representations of concepts ("features") in activation space. In contrast, we explore whether some
    language model representations may be inherently multi-dimensional. We begin by developing a rigorous
    definition of irreducible multi-dimensional features based on whether they can be decomposed into
    either independent or non-co-occurring lower-dimensional features. Motivated by these definitions,
    we design a scalable method that uses sparse autoencoders to automatically find multi-dimensional
    features in GPT-2 and Mistral 7B. These auto-discovered features include strikingly interpretable
    examples, e.g. circular features representing days of the week and months of the year. We identify
    tasks where these exact circles are used to solve computational problems involving modular arithmetic
    in days of the week and months of the year. Next, we provide evidence that these circular features
    are indeed the fundamental unit of computation in these tasks with intervention experiments on Mistral
    7B and Llama 3 8B, and we examine the continuity of the days of the week feature in Mistral 7B. Overall,
    our work argues that understanding multi-dimensional features is necessary to mechanistically decompose
    some model behaviors.
  read: partial
  notes: Relevant sections read and quotes grep-checked against papers/2405.14860.txt on 2026-09-26 (research
    agent + reading sub-agents). Title is 'One-Dimensionally Linear'. Irreducible multi-dimensional features
    (L215-216); circles live in a 2-D linear subspace (footnote L133-134); Table 1 accuracies (L426-429);
