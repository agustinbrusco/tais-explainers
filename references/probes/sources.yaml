    detector (L529-548; Table 4 AUC 0.991 -> 0.376 and 0.996 -> 0.655, large std); policy-gradient argument
    (App. D L1026-1061); gradients through probe ''should absolutely be avoided'' (L594-596); Table 16
    outcomes (L1612-1632); retraining doesn''t help (L1505-1510); recommendations and limits (L643-668).'
- id: arxiv:2608.21664
  title: Measuring Activation Control in Large Language Models
  authors:
  - Marek Mateusz Kowalski
  - Joshua Fonseca Rivera
  - Uzay Macar
  - David Demitri Africa
  date: '2026-08-21'
  url: https://arxiv.org/abs/2608.21664
  abstract: Safe deployment of increasingly capable models will likely come to rely on latent-space monitoring
    as a complement to behavioral evaluations, especially when evaluation-aware models exhibit scheming
    or deception. However, if models can also control their own activations, deception could extend into
    the latent space itself. With this in mind, we introduce the Activation Controllability Benchmark
    to quantify the extent to which models can modulate their residual stream via natural-language instruction.
    Across model families and capability levels, we find that most LLMs can control the direction and
    magnitude of their residual stream activations with some degree of temporal resolution, though performance
    varies considerably across models. In simple tasks, this level of control can evade activation-based
    monitoring methods (including linear probes, natural language autoencoders, activation oracles, and
    the Jacobian lens), albeit imperfectly. These results suggest that control over the activation space
    itself could become a confound for monitoring as introspective capabilities increase; therefore, we
    recommend that frontier labs and evaluators track activation controllability in future models.
