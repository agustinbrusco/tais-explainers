    fail, onion probe works (Table 4, L799-805); onion intervention 87% vs 1% (L456-459); only small models,
    untested in transformers (L556-560). Size thresholds inconsistent (L275 vs L525).
- id: arxiv:2212.03827
  title: Discovering Latent Knowledge in Language Models Without Supervision
  authors:
  - Collin Burns
  - Haotian Ye
  - Dan Klein
  - Jacob Steinhardt
  date: '2022-12-07'
  url: https://arxiv.org/abs/2212.03827
  abstract: 'Existing techniques for training language models can be misaligned with the truth: if we
    train models with imitation learning, they may reproduce errors that humans make; if we train them
    to generate text that humans rate highly, they may output errors that human evaluators can''t detect.
    We propose circumventing this issue by directly finding latent knowledge inside the internal activations
    of a language model in a purely unsupervised way. Specifically, we introduce a method for accurately
    answering yes-no questions given only unlabeled model activations. It works by finding a direction
    in activation space that satisfies logical consistency properties, such as that a statement and its
    negation have opposite truth values. We show that despite using no supervision and no model outputs,
    our method can recover diverse knowledge represented in large language models: across 6 models and
    10 question-answering datasets, it outperforms zero-shot accuracy by 4\% on average. We also find
    that it cuts prompt sensitivity in half and continues to maintain high accuracy even when models are
    prompted to generate incorrect answers. Our results provide an initial step toward discovering what
    language models know, distinct from what they say, even when we don''t have access to explicit ground
    truth labels.'
  read: partial
  notes: Relevant sections read and quotes grep-checked against papers/2212.03827.txt on 2026-09-26 (research
    agent + reading sub-agents). CCS method (§2.2, L160-235); Table 1 means 0-shot 62.8 / calibrated 67.2
    / CCS 71.2 / LR ceiling 83.7 (L272-277); misleading prefix (L339-342) with ambiguity caveat (L880-881);
    'in what sense' (L348-349); Table 2 CRC-TPC 70.1, CRC-BSS 70.2 (L538-539); §5.1 limits (L581-587).
- id: arxiv:2312.10029
  title: Challenges with unsupervised LLM knowledge discovery
  authors:
  - Sebastian Farquhar
  - Vikrant Varma
  - Zachary Kenton
  - Johannes Gasteiger
  - Vladimir Mikulik
  - Rohin Shah
  date: '2023-12-15'
  url: https://arxiv.org/abs/2312.10029
  abstract: We show that existing unsupervised methods on large language model (LLM) activations do not
    discover knowledge -- instead they seem to discover whatever feature of the activations is most prominent.
    The idea behind unsupervised knowledge elicitation is that knowledge satisfies a consistency structure,
    which can be used to discover knowledge. We first prove theoretically that arbitrary features (not
    just knowledge) satisfy the consistency structure of a particular leading unsupervised knowledge-elicitation
    method, contrast-consistent search (Burns et al. - arXiv:2212.03827). We then present a series of
    experiments showing settings in which unsupervised methods result in classifiers that do not predict
    knowledge, but instead predict a different prominent feature. We conclude that existing unsupervised
    methods for discovering latent knowledge are insufficient, and we contribute sanity checks to apply
    to evaluating future knowledge elicitation methods. Conceptually, we hypothesise that the identification
    issues explored here, e.g. distinguishing a model's knowledge from that of a simulated character's,
    will persist for future unsupervised methods.
