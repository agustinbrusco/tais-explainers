    / 20 episodes per cell, no weight updates (L693-698).'
- id: arxiv:2606.24251
  title: Probing the Misaligned Thinking Process of Language Models
  authors:
  - Kaiwen Zhou
  - Constantin Venhoff
  - Jonathan Michala
  - Xin Eric Wang
  - William Saunders
  date: '2026-06-23'
  url: https://arxiv.org/abs/2606.24251
  abstract: Large language models exhibit a growing range of misaligned behaviors such as strategic deception,
    sandbagging, and self-preservation. As they are increasingly deployed in high-stakes settings, it
    is critical to reliably detect such behaviors to ensure safe and responsible use. In this work, we
    propose to monitor misalignment by decomposing it into fine-grained cognitive processes -- misalignment
    indicators -- and detecting their presence in a model's internal activations via linear probes. We
    develop a taxonomy of 18 indicators spanning different misaligned behaviors, paired with an automated,
    meta-plan-guided pipeline that generates multi-turn training conversations. To rigorously evaluate
    generalization, we construct an out-of-distribution suite combining automated behavioral elicitation,
    established misalignment benchmarks, and natural benign conversations. Across 5 misaligned behaviors,
    our probes match a strong LLM judge with 0.935 AUROC on out-of-distribution benchmarks while keeping
    a low false positive rate on benign traffic. We further perform in-depth analysis to understand the
    probes and the model's internal representations of misalignment indicators.
