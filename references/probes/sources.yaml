    agent + reading sub-agents). Activation Controllability Benchmark: design (L20-22, L47-49, L114-149);
    S 0.059-0.538 over 25 models (L305-310); suppression evades probes (5-21% at 1% FPR), NLA 0/500, J-lens,
    AOs (L579-581, L612-641); limits: simple concepts, unhardened monitors, visible instruction (L640-652);
    recommendations (L33-34, L671-673).'
- id: arxiv:2509.26238
  title: 'Beyond Linear Probes: Dynamic Safety Monitoring for Language Models'
  authors:
  - James Oldfield
  - Philip Torr
  - Ioannis Patras
  - Adel Bibi
  - Fazl Barez
  date: '2025-09-30'
  url: https://arxiv.org/abs/2509.26238
  abstract: 'Monitoring large language models'' (LLMs) activations is an effective way to detect harmful
    requests before they lead to unsafe outputs. However, traditional safety monitors often require the
    same amount of compute for every query. This creates a trade-off: expensive monitors waste resources
    on easy inputs, while cheap ones risk missing subtle cases. We argue that safety monitors should be
    flexible--costs should rise only when inputs are difficult to assess, or when more compute is available.
    To achieve this, we introduce Truncated Polynomial Classifiers (TPCs), a natural extension of linear
    probes for dynamic activation monitoring. Our key insight is that polynomials can be trained and evaluated
    progressively, term-by-term. At test-time, one can early-stop for lightweight monitoring, or use more
    terms for stronger guardrails when needed. TPCs provide two modes of use. First, as a safety dial:
    by evaluating more terms, developers and regulators can "buy" stronger guardrails from the same model.
    Second, as an adaptive cascade: clear cases exit early after low-order checks, and higher-order guardrails
    are evaluated only for ambiguous inputs, reducing overall monitoring costs. On WildGuardMix, across
    4 models with up to 30B parameters, we show that TPCs compete with or outperform MLP-based probe baselines
    of the same size for harmful prompt classification, all the while being more interpretable than their
    black-box counterparts. Our code is available at http://github.com/james-oldfield/tpc.'
  read: partial
  notes: 'Relevant sections read and quotes grep-checked against papers/2509.26238.txt on 2026-09-26 (research
    agent + reading sub-agents). Truncated polynomial classifiers: order 1 = linear probe (L289-290);
    dial and cascade (L32-34, L327-328); Table 1 (L556-563); parameter counts (App. Table 4, L1567-1571);
    limits (L708-724, L1705).'
- id: arxiv:1807.03888
  title: A Simple Unified Framework for Detecting Out-of-Distribution Samples and Adversarial Attacks
  authors:
  - Kimin Lee
  - Kibok Lee
  - Honglak Lee
  - Jinwoo Shin
  date: '2018-07-10'
  url: https://arxiv.org/abs/1807.03888
  abstract: 'Detecting test samples drawn sufficiently far away from the training distribution statistically
    or adversarially is a fundamental requirement for deploying a good classifier in many real-world machine
    learning applications. However, deep neural networks with the softmax classifier are known to produce
    highly overconfident posterior distributions even for such abnormal samples. In this paper, we propose
    a simple yet effective method for detecting any abnormal samples, which is applicable to any pre-trained
    softmax neural classifier. We obtain the class conditional Gaussian distributions with respect to
    (low- and upper-level) features of the deep models under Gaussian discriminant analysis, which result
    in a confidence score based on the Mahalanobis distance. While most prior methods have been evaluated
    for detecting either out-of-distribution or adversarial samples, but not both, the proposed method
    achieves the state-of-the-art performances for both cases in our experiments. Moreover, we found that
    our proposed method is more robust in harsh cases, e.g., when the training dataset has noisy labels
    or small number of samples. Finally, we show that the proposed method enjoys broader usage by applying
    it to class-incremental learning: whenever out-of-distribution samples are detected, our classification
    rule can incorporate new classes well without further training deep models.'
