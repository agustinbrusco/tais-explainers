- id: arxiv:2511.17408
  title: The Impact of Off-Policy Training Data on Probe Generalisation
  authors:
  - Nathalie Kirch
  - Samuel Dower
  - Adrians Skapars
  - Helen Yannakoudakis
  - Ekdeep Singh Lubana
  - Dmitrii Krasheninnikov
  date: '2025-11-21'
  url: https://arxiv.org/abs/2511.17408
  abstract: 'Probing has emerged as a promising method for monitoring large language models (LLMs), enabling
    cheap inference-time detection of concerning behaviours. However, natural examples of many behaviours
    are rare, forcing researchers to rely on synthetic or off-policy LLM responses for training probes.
    We systematically evaluate how off-policy data influences probe generalisation across eight distinct
    LLM behaviours. Testing linear and attention probes across multiple LLMs, we find that training data
    generation strategy can significantly affect probe performance, though the magnitude varies greatly
    by behaviour. The largest generalisation failures arise for behaviours defined by response ``intent''''
    (e.g., strategic deception) rather than text-level content (e.g., usage of lists). We then propose
    a useful test for predicting generalisation failures in cases where on-policy test data is unavailable:
    successful generalisation to incentivised data (where the model was coerced) strongly correlates with
    high performance against on-policy examples. Based on these results, we predict that current deception
    probes may fail to generalise to real monitoring scenarios. We find that off-policy data can yield
    more reliable probes than on-policy data from a sufficiently different setting. This underscores the
    need for better monitoring methods that handle all types of distribution shift.'
