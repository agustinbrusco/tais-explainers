    agent + reading sub-agents). MDL: definition (L69-75), variational/online codes (L93-118); layer 0:
    control accuracy higher but code twice longer (L363-368, row L333); accuracy wrong in 8/10 settings
    (L377); random-init ELMo (L485-578).'
- id: arxiv:2006.00995
  title: 'Amnesic Probing: Behavioral Explanation with Amnesic Counterfactuals'
  authors:
  - Yanai Elazar
  - Shauli Ravfogel
  - Alon Jacovi
  - Yoav Goldberg
  date: '2020-06-01'
  url: https://arxiv.org/abs/2006.00995
  abstract: A growing body of work makes use of probing to investigate the working of neural models, often
    considered black boxes. Recently, an ongoing debate emerged surrounding the limitations of the probing
    paradigm. In this work, we point out the inability to infer behavioral conclusions from probing results
    and offer an alternative method that focuses on how the information is being used, rather than on
    what information is encoded. Our method, Amnesic Probing, follows the intuition that the utility of
    a property for a given task can be assessed by measuring the influence of a causal intervention that
    removes it from the representation. Equipped with this new analysis tool, we can ask questions that
    were not possible before, e.g. is part-of-speech information important for word prediction? We perform
    a series of analyses on BERT to answer these types of questions. Our findings demonstrate that conventional
    probing performance is not correlated to task importance, and we call for increased scrutiny of claims
    that draw behavioral or causal conclusions from probing results.
