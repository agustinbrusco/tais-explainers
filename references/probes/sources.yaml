    agent + reading sub-agents). SEP = logistic regression predicting binarized semantic entropy from
    one generation's hidden states (L239-254); cost (L22-27); better OOD than accuracy probes (L27-29;
    Tab. 2 L714-723), worse in-distribution (L484-490); below sampling-based SE (L296-297). Protocol inconsistency
    L461-462 vs L1701-1702.
- id: arxiv:2312.06681
  title: Steering Llama 2 via Contrastive Activation Addition
  authors:
  - Nina Panickssery
  - Nick Gabrieli
  - Julian Schulz
  - Meg Tong
  - Evan Hubinger
  - Alexander Matt Turner
  date: '2023-12-09'
  url: https://arxiv.org/abs/2312.06681
  abstract: We introduce Contrastive Activation Addition (CAA), an innovative method for steering language
    models by modifying their activations during forward passes. CAA computes "steering vectors" by averaging
    the difference in residual stream activations between pairs of positive and negative examples of a
    particular behavior, such as factual versus hallucinatory responses. During inference, these steering
    vectors are added at all token positions after the user's prompt with either a positive or negative
    coefficient, allowing precise control over the degree of the targeted behavior. We evaluate CAA's
    effectiveness on Llama 2 Chat using multiple-choice behavioral question datasets and open-ended generation
    tasks. We demonstrate that CAA significantly alters model behavior, is effective over and on top of
    traditional methods like finetuning and system prompt design, and minimally reduces capabilities.
    Moreover, we gain deeper insights into CAA's mechanisms by employing various activation space interpretation
    methods. CAA accurately steers model outputs and sheds light on how high-level concepts are represented
    in Large Language Models (LLMs).
