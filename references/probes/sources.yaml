    agent + reading sub-agents). Textual leakage: definitions (L21-29); filtering (L66-69); AUROC drops
    (L332-354); recall Table 1 (L380-385); organisms: sandbagging 0.94 -> 0.5, bias 0.74 -> 0.57 (L488-492;
    abstract says 0.57 for sandbagging); conclusion (L519-521); limits (L501-508).'
- id: arxiv:2412.09565
  title: Obfuscated Activations Bypass LLM Latent-Space Defenses
  authors:
  - Luke Bailey
  - Alex Serrano
  - Abhay Sheshadri
  - Mikhail Seleznyov
  - Jordan Taylor
  - Erik Jenner
  - Jacob Hilton
  - Stephen Casper
  - Carlos Guestrin
  - Scott Emmons
  date: '2024-12-12'
  url: https://arxiv.org/abs/2412.09565
  abstract: 'Recent latent-space monitoring techniques have shown promise as defenses against LLM attacks.
    These defenses act as scanners that seek to detect harmful activations before they lead to undesirable
    actions. This prompts the question: Can models execute harmful behavior via inconspicuous latent states?
    Here, we study such obfuscated activations. We show that state-of-the-art latent-space defenses --
    including sparse autoencoders, representation probing, and latent OOD detection -- are all vulnerable
    to obfuscated activations. For example, against probes trained to classify harmfulness, our attacks
    can often reduce recall from 100% to 0% while retaining a 90% jailbreaking rate. However, obfuscation
    has limits: we find that on a complex task (writing SQL code), obfuscation reduces model performance.
    Together, our results demonstrate that neural activations are highly malleable: we can reshape activation
    patterns in a variety of ways, often while preserving a network''s behavior. This poses a fundamental
    challenge to latent-space defenses.'
