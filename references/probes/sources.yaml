- id: arxiv:2004.03061
  title: Information-Theoretic Probing for Linguistic Structure
  authors:
  - Tiago Pimentel
  - Josef Valvoda
  - Rowan Hall Maudslay
  - Ran Zmigrod
  - Adina Williams
  - Ryan Cotterell
  date: '2020-04-07'
  url: https://arxiv.org/abs/2004.03061
  abstract: 'The success of neural networks on a diverse set of NLP tasks has led researchers to question
    how much these networks actually ``know'''' about natural language. Probes are a natural way of assessing
    this. When probing, a researcher chooses a linguistic task and trains a supervised model to predict
    annotations in that linguistic task from the network''s learned representations. If the probe does
    well, the researcher may conclude that the representations encode knowledge related to the task. A
    commonly held belief is that using simpler models as probes is better; the logic is that simpler models
    will identify linguistic structure, but not learn the task itself. We propose an information-theoretic
    operationalization of probing as estimating mutual information that contradicts this received wisdom:
    one should always select the highest performing probe one can, even if it is more complex, since it
    will result in a tighter estimate, and thus reveal more of the linguistic information inherent in
    the representation. The experimental portion of our paper focuses on empirically estimating the mutual
    information between a linguistic property and BERT, comparing these estimates to several baselines.
    We evaluate on a set of ten typologically diverse languages often underrepresented in NLP research---plus
    English---totalling eleven languages.'
  read: partial
  notes: Relevant sections read and quotes grep-checked against papers/2004.03061.txt on 2026-09-26 (research
    agent + reading sub-agents). Use the highest-performing probe (abstract L39-45); DPI, Theorem 1 (L105-111,
    L307-308); gain (L227-229); BERT at most 12% over a type-level baseline (L504-506); critique of control
    tasks (§5, L363-403).
- id: arxiv:2003.12298
  title: Information-Theoretic Probing with Minimum Description Length
  authors:
  - Elena Voita
  - Ivan Titov
  date: '2020-03-27'
  url: https://arxiv.org/abs/2003.12298
  abstract: 'To measure how well pretrained representations encode some linguistic property, it is common
    to use accuracy of a probe, i.e. a classifier trained to predict the property from the representations.
    Despite widespread adoption of probes, differences in their accuracy fail to adequately reflect differences
    in representations. For example, they do not substantially favour pretrained representations over
    randomly initialized ones. Analogously, their accuracy can be similar when probing for genuine linguistic
    labels and probing for random synthetic tasks. To see reasonable differences in accuracy with respect
    to these random baselines, previous work had to constrain either the amount of probe training data
    or its model size. Instead, we propose an alternative to the standard probes, information-theoretic
    probing with minimum description length (MDL). With MDL probing, training a probe to predict labels
    is recast as teaching it to effectively transmit the data. Therefore, the measure of interest changes
    from probe accuracy to the description length of labels given representations. In addition to probe
    quality, the description length evaluates "the amount of effort" needed to achieve the quality. This
    amount of effort characterizes either (i) size of a probing model, or (ii) the amount of data needed
    to achieve the high quality. We consider two methods for estimating MDL which can be easily implemented
    on top of the standard probing pipelines: variational coding and online coding. We show that these
    methods agree in results and are more informative and stable than the standard probes.'
