    (L188-189); probes 0.935 OOD AUROC (L130-132), cascade 0.950 vs 0.936 (L309-316); cascade 87.0% TPR
    at 0.47% FPR with 6.1% LLM calls (L316-323); authorized-misalignment FPR 97.7%, hard-negative FPR
    19.2% (§3.2.4, L634-648). ICML 2026 MI workshop; Anthropic Fellows/MATS.
