    layer 13 in 7B (L242-245); Table 3 13B (L318-331); per-token detection via dot product (L437-439);
    open-ended degradation (L310-312).
- id: arxiv:2406.11717
  title: Refusal in Language Models Is Mediated by a Single Direction
  authors:
  - Andy Arditi
  - Oscar Obeso
  - Aaquib Syed
  - Daniel Paleka
  - Nina Panickssery
  - Wes Gurnee
  - Neel Nanda
  date: '2024-06-17'
  url: https://arxiv.org/abs/2406.11717
  abstract: Conversational large language models are fine-tuned for both instruction-following and safety,
    resulting in models that obey benign requests but refuse harmful ones. While this refusal behavior
    is widespread across chat models, its underlying mechanisms remain poorly understood. In this work,
    we show that refusal is mediated by a one-dimensional subspace, across 13 popular open-source chat
    models up to 72B parameters in size. Specifically, for each model, we find a single direction such
    that erasing this direction from the model's residual stream activations prevents it from refusing
    harmful instructions, while adding this direction elicits refusal on even harmless instructions. Leveraging
    this insight, we propose a novel white-box jailbreak method that surgically disables refusal with
    minimal effect on other capabilities. Finally, we mechanistically analyze how adversarial suffixes
    suppress propagation of the refusal-mediating direction. Our findings underscore the brittleness of
    current safety fine-tuning methods. More broadly, our work showcases how an understanding of model
    internals can be leveraged to develop practical methods for controlling model behavior.
