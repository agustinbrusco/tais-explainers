    agent + reading sub-agents). Among Us: Phi-4 L20 probes (L403-415); RepEng-trained 0.94 lying / 0.99
    deception (L439-442); impostor-label confound (L371-372, L534-535); AUC 0.653 (actions) vs 1.000 (+system)
    (Fig. 6, L355-361); SAE features (L466-498).'
- id: arxiv:2511.16035
  title: 'Liars'' Bench: Evaluating Lie Detectors for Language Models'
  authors:
  - Kieron Kretschmar
  - Walter Laurito
  - Sharan Maiya
  - Samuel Marks
  date: '2025-11-20'
  url: https://arxiv.org/abs/2511.16035
  abstract: 'Prior work has introduced techniques for detecting when large language models (LLMs) lie,
    that is, generate statements they believe are false. However, these techniques are typically validated
    in narrow settings that do not capture the diverse lies LLMs can generate. We introduce LIARS'' BENCH,
    a testbed consisting of 72,863 examples of lies and honest responses generated by four open-weight
    models across seven datasets. Our settings capture qualitatively different types of lies and vary
    along two dimensions: the model''s reason for lying and the object of belief targeted by the lie.
    Evaluating three black- and white-box lie detection techniques on LIARS'' BENCH, we find that existing
    techniques systematically fail to identify certain types of lies, especially in settings where it''s
    not possible to determine whether the model lied from the transcript alone. Overall, LIARS'' BENCH
    reveals limitations in prior techniques and provides a practical testbed for guiding progress in lie
    detection.'
