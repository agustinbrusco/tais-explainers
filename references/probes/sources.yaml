- id: arxiv:2511.22662
  title: Difficulties with Evaluating a Deception Detector for AIs
  authors:
  - Lewis Smith
  - Bilal Chughtai
  - Neel Nanda
  date: '2025-11-27'
  url: https://arxiv.org/abs/2511.22662
  abstract: Building reliable deception detectors for AI systems -- methods that could predict when an
    AI system is being strategically deceptive without necessarily requiring behavioural evidence -- would
    be valuable in mitigating risks from advanced AI systems. But evaluating the reliability and efficacy
    of a proposed deception detector requires examples that we can confidently label as either deceptive
    or honest. We argue that we currently lack the necessary examples and further identify several concrete
    obstacles in collecting them. We provide evidence from conceptual arguments, analysis of existing
    empirical works, and analysis of novel illustrative case studies. We also discuss the potential of
    several proposed empirical workarounds to these problems and argue that while they seem valuable,
    they also seem insufficient alone. Progress on deception detection likely requires further consideration
    of these problems.
  read: partial
  notes: 'Relevant sections read and quotes grep-checked against papers/2511.22662.txt on 2026-09-26 by
    the research agent. Evaluating deception detectors needs confidently labelled examples, which we lack
    (abstract); three problems: strategic vs reflexive (stick insect), role-play, prompts changing beliefs
    (L113-127); workarounds valuable but insufficient (abstract). GDM authors.'
- id: arxiv:2606.12618
  title: '"Did you lie?" Evaluating Lie Detectors across Model Scale and Belief-Verified Model Organisms'
  authors:
  - Alan Cooney
  - David Africa
  - Geoffrey Irving
  date: '2026-06-10'
  url: https://arxiv.org/abs/2606.12618
  abstract: 'Robust lie detectors for language models could enable powerful techniques for auditing, monitoring,
    and post-hoc investigation of model behaviour, but evaluating them requires testbeds where models
    verifiably believe the opposite of what they say. We show that existing trained model organisms often
    fail this requirement, leaving prior positive and negative detection results difficult to interpret.
    We address this with 13 reasoning model organisms whose hidden beliefs are verified in chain-of-thought
    and shown to generalise to held-out tasks, alongside Varied Deception, a prompted-lying testbed covering
    a broad range of lie-inducing motivations. On these testbeds we evaluate four detectors: a chain-of-thought
    judge, a logprob classifier, and two activation probes, including Did-You-Lie (DYL), a new method
    for training follow-up probes. On prompted lying, across 31 open-weight models spanning 2B to 1T parameters,
    all four detectors show positive scaling with model capability. However, every activation- and logprob-based
    detector drops sharply on our trained model organisms, with DYL retaining the most signal; only the
    chain-of-thought judge remains strong, with 0.82 balanced accuracy, partly as an artefact of our verification
    process favouring CoT-readable beliefs. Current lie detectors therefore cannot support high-confidence
    claims about model beliefs, and we suggest research directions that may address some of their current
    limitations. We release our datasets, model organisms, and trained detectors.'
  read: partial
  notes: 'Relevant sections read and quotes grep-checked against papers/2606.12618.txt on 2026-09-26 by
    the research agent. UK AISI. 4 detectors, 31 open-weight models 2B-1T: positive scaling on prompted
    lying (Spearman 0.41-0.71, L153-156); on 13 belief-verified trained organisms, balanced accuracy Apollo
    0.85 -> 0.52, DYL 0.81 -> 0.65, unrelated Qs 0.85 -> 0.50; CoT judge 0.82 (L686-692); App. E: Apollo
    released threshold code pools token activations; corrected Roleplaying TPR@1%FPR 96% -> 73.2% (L1279-1332);
    limits (§8, L742-770).'
