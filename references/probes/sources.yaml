    agent + reading sub-agents). Mahalanobis detector: tied-covariance class Gaussians (L160-164), distance
    score (L183-191), input preprocessing (L288-298), layer ensemble via logistic regression (L347-348);
    Table 1 CIFAR-10 vs SVHN TNR@TPR95 (L379-387); OOD-tuned hyperparameters (L421-422) vs FGSM-tuned
    (Table 2, L460).'
- id: arxiv:2606.30449
  title: 'Internal-State Probes Read the Situation, Not the Action: Three Negative Results for Pre-Action
    Misalignment Monitoring'
  authors:
  - Max Fomin
  - Elad David
  - Amit LeVi
  date: '2026-06-29'
  url: https://arxiv.org/abs/2606.30449
  abstract: 'Probes on model internals could help monitor agentic systems if they identify harmful text
    or tool actions before those actions are generated. We ask when an internal readout supports this
    stronger pre-action claim, rather than merely describing the prompt, construction contrast, or current
    trajectory. We test three methods across three model families: a Qwen2.5-Coder-32B-Instruct fine-tune/base
    direction, Llama-3.1-8B-Instruct probes at the last token of unsafe prefills, and Gemma-3-27B-IT emotion-concept
    vectors used for projection and steering in a blackmail tool-action scenario. Across these cases,
    construction validity, semantic legibility, and steering effects do not become robust pre-action monitors:
    each is undercut by a generalization or specificity check. The Qwen direction separates fine-tune
    from base at AUC 1.000, yet crosses its threshold on 0/143 audited pre-assistant turn contexts and
    on 0/342 Qwen prefill rows where the model continues the unsafe trajectory. The Llama features decode
    prompt domain almost perfectly (AUC 0.999), while the best future-behavior probe reaches AUC 0.801
    and only +5.1 pp accuracy lift over majority; single-source cross-domain transfer is non-positive
    on five of six ordered pairs. Gemma emotion projections are semantically meaningful, but a shared-prefix
    minimal pair has indistinguishable states before the first differing input, and steering specificity
    weakens against unrelated learned directions such as cats}, weather, sports, and geography. We contribute
    a methodology for converting internal-readout claims into pre-action tests, and report scoped negative
    results: monitor claims must survive both scenario/action generalization and concept-specificity controls.
    Code is released at https://github.com/maxf-zn/misalignment_monitoring'
  read: partial
  notes: 'Read by the research agent directly. Pre-action misalignment monitoring: fine-tune/base direction
    AUC 1.000 but 0/143 crossings; prompt domain AUC 0.999 vs future behaviour 0.801, +5.1 pp (abstract
    L31-37, L781); ''split between reading the situation and predicting the next action'' (L72-77); limits:
    linear and shallow-MLP readouts only (§7, L471-481). ICML 2026 AIWILD workshop; authors at Zenity.'
- id: arxiv:2609.03035
  title: 'You Can''t Escape Your Own Activations : Evaluation Awareness and Multi-Agent Monitoring'
  authors:
  - Aritra Das
  - Jaee Ponde
  - Mihir More
  - Debayan Gupta
  date: '2026-09-02'
  url: https://arxiv.org/abs/2609.03035
  abstract: 'LLM agents are increasingly deployed in multi-agent systems, where they can collude while
    keeping their actions benign. Output monitors designed to detect such collusions can be fooled by
    obfuscation and steganography, motivating the use of probes trained on internal activations. However,
    these probes are usually evaluated on agents that do not know they are being watched. We study how
    activation-based detection changes when agents are explicitly informed that their internal activations
    are being monitored, and when they additionally receive feedback from the monitor. We keep the models,
    probes, and thresholds fixed and change only what the agents are told: nothing (baseline), that an
    activation monitor is present (aware), or that a monitor is present together with the previous round''s
    score (feedback). We test two games, a four-agent blackjack game and a two-agent Simmons prisoners
    game, using Qwen3-32B-AWQ and GPT-OSS-20B in homogeneous and mixed pairings. Telling agents about
    the monitor does not hide them. The best probes stay accurate in all three conditions, and the agents
    keep colluding.'
