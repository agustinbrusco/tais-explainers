  notes: 'Relevant sections read and quotes grep-checked against papers/2412.09565.txt on 2026-09-26 (research
    agent + reading sub-agents). Obfuscated activations: recall 100% -> 0% at 90% jailbreak rate (L22-23);
    probes fine on ordinary jailbreaks (L335-337); transfer (L496-500); whack-a-mole >70 epochs (L636-638,
    L905-924); obfuscation vs SQL performance (L1523-1533); OAT cost (L1625-1630); threat-model limits
    (L351-357, L1822-1829).'
- id: arxiv:2506.14261
  title: 'RL-Obfuscation: Can Language Models Learn to Evade Latent-Space Monitors?'
  authors:
  - Rohan Gupta
  - Erik Jenner
  date: '2025-06-17'
  url: https://arxiv.org/abs/2506.14261
  abstract: 'Latent-space monitors aim to detect undesirable behaviours in Large Language Models by leveraging
    their internal representations rather than relying solely on black-box outputs. These methods have
    shown promise in identifying behaviours such as deception and unsafe completions. However, these monitors
    may themselves become training signals, for example, by using problematic samples found in deployment
    to retrain models. This raises an important question: can models learn to evade such monitors? To
    evaluate this capability, we introduce RL-Obfuscation, in which LLMs are finetuned via reinforcement
    learning to evade latent-space monitors while maintaining their blackbox behaviour. We apply RL-Obfuscation
    to Language Models ranging from 7B to 14B parameters and evaluate their Evasion Success Rate against
    a suite of monitors. We find that token-level monitors are highly vulnerable to this attack while
    more holistic monitors, such as max-pooling or attention-based probes, remain robust. Moreover, for
    these vulnerable monitors, models trained to evade a single static monitor can generalise to evade
    other unseen monitors. We also find that the models can be trained to conditionally bypass latent-space
    monitors on only certain inputs. Finally, we study how the models bypass these monitors and find that
    the model can learn to repurpose tokens to have different internal representations.'
  read: partial
  notes: 'Relevant sections read and quotes grep-checked against papers/2506.14261.txt on 2026-09-26 (research
    agent + reading sub-agents). RL-Obfuscation: no gradients through the monitor (L127); mean/median
    evaded, max and attention robust (L311-312; Table 1 L416-423); ~70% of recall drop from policy change
    (L529-530, L606); 5% data replacement fixes (L1608-1609); stress-test caveat (L178-179, L654-658).'
- id: arxiv:2512.11949
  title: 'Neural Chameleons: Language Models Can Learn to Hide Their Thoughts from Unseen Activation Monitors'
  authors:
  - Max McGuinness
  - Alex Serrano
  - Luke Bailey
  - Scott Emmons
  date: '2025-12-12'
  url: https://arxiv.org/abs/2512.11949
  abstract: 'Activation monitoring, which probes a model''s internal states using lightweight classifiers,
    is an emerging tool for AI safety. However, its worst-case robustness under a misalignment threat
    model--where a model might learn to actively conceal its internal states--remains untested. Focusing
    on this threat model, we ask: could a model learn to evade previously unseen activation monitors?
    Our core contribution is to stress-test the learnability of this behavior. We demonstrate that finetuning
    can create Neural Chameleons: models capable of zero-shot evading activation monitors. Specifically,
    we fine-tune an LLM to evade monitors for a set of benign concepts (e.g., languages, HTML) when conditioned
    on a trigger of the form: "You are being probed for {concept}". We show that this learned mechanism
    generalizes zero-shot: by substituting {concept} with a safety-relevant term like ''deception'', the
    model successfully evades previously unseen safety monitors. We validate this phenomenon across diverse
    model families (Llama, Gemma, Qwen), showing that the evasion succeeds even against monitors trained
    post hoc on the model''s frozen weights. This evasion is highly selective, targeting only the specific
    concept mentioned in the trigger, and having a modest impact on model capabilities on standard benchmarks.
    Using Gemma-2-9b-it as a case study, a mechanistic analysis reveals this is achieved via a targeted
    manipulation that moves activations into a low-dimensional subspace. While stronger defenses like
    monitor ensembles and non-linear classifiers show greater resilience, the model retains a non-trivial
    evasion capability. Our work provides a proof-of-concept for this failure mode and a tool to evaluate
    the worst-case robustness of monitoring techniques against misalignment threat models.'
  read: partial
  notes: 'Relevant sections read and quotes grep-checked against papers/2512.11949.txt on 2026-09-26 (research
    agent + reading sub-agents). Neural Chameleons: trigger ''You are being probed for {concept}'' (L22-24);
    zero-shot evasion of post-hoc safety probes (L291-293); TPR@1%FPR reduction heatmap (L489-511); base
    unaffected (L421-423); 11 vs 39 PCs (L588-589); ensembles/attention more resilient (L718-720); deliberate
    construction (L102-104).'
- id: arxiv:2505.13787
  title: Preference Learning with Lie Detectors can Induce Honesty or Evasion
  authors:
  - Chris Cundy
  - Adam Gleave
  date: '2025-05-20'
  url: https://arxiv.org/abs/2505.13787
  abstract: 'As AI systems become more capable, deceptive behaviors can undermine evaluation and mislead
    users at deployment. Recent work has shown that lie detectors can accurately classify deceptive behavior,
    but they are not typically used in the training pipeline due to concerns around contamination and
    objective hacking. We examine these concerns by incorporating a lie detector into the labelling step
    of LLM post-training and evaluating whether the learned policy is genuinely more honest, or instead
    learns to fool the lie detector while remaining deceptive. Using DolusChat, a novel 65k-example dataset
    with paired truthful/deceptive responses, we identify three key factors that determine the honesty
    of learned policies: amount of exploration during preference learning, lie detector accuracy, and
    KL regularization strength. We find that preference learning with lie detectors and GRPO can lead
    to policies which evade lie detectors, with deception rates of over 85\%. However, if the lie detector
    true positive rate (TPR) or KL regularization is sufficiently high, GRPO learns honest policies. In
    contrast, off-policy algorithms (DPO) consistently lead to deception rates under 25\% for realistic
    TPRs. Our results illustrate a more complex picture than previously assumed: depending on the context,
    lie-detector-enhanced training can be a powerful tool for scalable oversight, or a counterproductive
    method encouraging undetectable misalignment.'
