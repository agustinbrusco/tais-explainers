    behaviours fail most (L33-38, L380-385); domain > policy shift (Cohen''s d 1.42 vs 0.60, L294-304);
    deception -0.416 (Table 1, L423); incentivised-data proxy r=0.793 (L463-464, excl. deception L504-505);
    forecast (L45-48).'
- id: arxiv:2509.21344
  title: 'Linear probes rely on textual evidence: Results from leakage mitigation studies in language
    models'
  authors:
  - Gerard Boxo
  - Aman Neelappa
  - Shivam Raval
  date: '2025-09-16'
  url: https://arxiv.org/abs/2509.21344
  abstract: 'White-box monitors are a popular technique for detecting potentially harmful behaviours in
    language models. While they perform well in general, their effectiveness in detecting text-ambiguous
    behaviour is disputed. In this work, we find evidence that removing textual evidence of a behaviour
    significantly decreases probe performance. The AUROC reduction ranges from $10$- to $30$-point depending
    on the setting. We evaluate probe monitors across three setups (Sandbagging, Sycophancy, and Bias),
    finding that when probes rely on textual evidence of the target behaviour (such as system prompts
    or CoT reasoning), performance degrades once these tokens are filtered. This filtering procedure is
    standard practice for output monitor evaluation. As further evidence of this phenomenon, we train
    Model Organisms which produce outputs without any behaviour verbalisations. We validate that probe
    performance on Model Organisms is substantially lower than unfiltered evaluations: $0.57$ vs $0.74$
    AUROC for Bias, and $0.57$ vs $0.94$ AUROC for Sandbagging. Our findings suggest that linear probes
    may be brittle in scenarios where they must detect non-surface-level patterns.'
