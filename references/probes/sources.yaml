    agent + reading sub-agents). SOLiD with lie detectors: GRPO >85% deceptive unless TPR/KL high; DPO
    <25% (abstract L25-29); detector on original model''s activations (L340-342); TPR cliff (L358-434);
    KL (L447-483); Fig. 5 8% / 93% / 15% (L964-966); recommendations (L1015-1018); stance (L150-152).'
- id: arxiv:2602.15515
  title: 'The Obfuscation Atlas: Mapping Where Honesty Emerges in RLVR with Deception Probes'
  authors:
  - Mohammad Taufeeque
  - Stefan Heimersheim
  - Adam Gleave
  - Chris Cundy
  date: '2026-02-17'
  url: https://arxiv.org/abs/2602.15515
  abstract: 'Training against white-box deception detectors has been proposed as a way to make AI systems
    honest. However, such training risks models learning to obfuscate their deception to evade the detector.
    Prior work has studied obfuscation only in artificial settings where models were directly rewarded
    for harmful output. We construct a realistic coding environment where reward hacking via hardcoding
    test cases naturally occurs, and show that obfuscation emerges in this setting. We introduce a taxonomy
    of possible outcomes when training against a deception detector. The model either remains honest,
    or becomes deceptive via two possible obfuscation strategies. (i) Obfuscated activations: the model
    outputs deceptive text while modifying its internal representations to no longer trigger the detector.
    (ii) Obfuscated policy: the model outputs deceptive text that evades the detector, typically by including
    a justification for the reward hack. Empirically, obfuscated activations arise from representation
    drift during RL, with or without a detector penalty. The detector penalty only incentivizes obfuscated
    policies; we theoretically show this is expected for policy gradient methods. Sufficiently high KL
    regularization and detector penalty can yield honest policies, establishing white-box deception detectors
    as viable training signals for tasks prone to reward hacking.'
