    Prompt 0.929, SAE 0.695 (Table 1, L438-460); steering Prompt 0.894, ReFT-r1 0.543, DiffMean 0.239,
    SAE 0.165, Probe 0.098 (Table 2, L591-601); ''better classification does not directly lead to better
    steering'' (L610).'
- id: arxiv:2502.03407
  title: Detecting Strategic Deception Using Linear Probes
  authors:
  - Nicholas Goldowsky-Dill
  - Bilal Chughtai
  - Stefan Heimersheim
  - Marius Hobbhahn
  date: '2025-02-05'
  url: https://arxiv.org/abs/2502.03407
  abstract: AI models might use deceptive strategies as part of scheming or misaligned behaviour. Monitoring
    outputs alone is insufficient, since the AI might produce seemingly benign outputs while their internal
    reasoning is misaligned. We thus evaluate if linear probes can robustly detect deception by monitoring
    model activations. We test two probe-training datasets, one with contrasting instructions to be honest
    or deceptive (following Zou et al., 2023) and one of responses to simple roleplaying scenarios. We
    test whether these probes generalize to realistic settings where Llama-3.3-70B-Instruct behaves deceptively,
    such as concealing insider trading (Scheurer et al., 2023) and purposely underperforming on safety
    evaluations (Benton et al., 2024). We find that our probe distinguishes honest and deceptive responses
    with AUROCs between 0.96 and 0.999 on our evaluation datasets. If we set the decision threshold to
    have a 1% false positive rate on chat data not related to deception, our probe catches 95-99% of the
    deceptive responses. Overall we think white-box probes are promising for future monitoring systems,
    but current performance is insufficient as a robust defence against deception. Our probes' outputs
    can be viewed at data.apolloresearch.ai/dd and our code at github.com/ApolloResearch/deception-detection.
