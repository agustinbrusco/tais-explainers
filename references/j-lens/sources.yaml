- id: arxiv:2607.15495
  title: Verbalizable Representations Form a Global Workspace in Language Models
  authors:
  - Wes Gurnee
  - Nicholas Sofroniew
  - Adam Pearce
  - Mateusz Piotrowski
  - Isaac Kauvar
  - Runjin Chen
  - Anna Soligo
  - Paul Bogdan
  - Euan Ong
  - Rowan Wang
  - Ben Thompson
  - David Abrahams
  - Subhash Kantamneni
  - Emmanuel Ameisen
  - Joshua Batson
  - Jack Lindsey
  date: '2026-07-16'
  url: https://arxiv.org/abs/2607.15495
  abstract: 'Out of everything the human brain processes, only a small fraction is consciously accessible,
    in the sense of being available for verbal report, deliberate control, and flexible reasoning. In
    this paper, we present evidence that an analogous functional distinction has emerged in large language
    models. Using a new interpretability technique, the Jacobian lens, we identify the representations
    a model is poised to verbalize at any point in its processing. These representations, which we collectively
    call the J-space, exhibit the functional properties characteristic of a global workspace: their contents
    can be reported, deliberately summoned and held, used to carry the intermediate steps of silent reasoning,
    and passed as arguments to arbitrary downstream computations, while automatic processing such as text
    parsing and routine inference proceeds without them. The J-space also has structural signatures that
    global workspace theory associates with conscious access: it carries coherent content only in an intermediate
    band of layers, holds on the order of tens of concepts at a time, and is broadcast by the model''s
    weights more widely than other representations. These properties make it a practical window into a
    model''s unspoken thinking. In alignment audits, it reveals strategic deliberation, evaluation awareness,
    and trained-in misaligned dispositions that never appear in the model''s outputs. We find that post-training
    installs the Assistant''s point of view in the workspace, and we introduce counterfactual reflection
    training, which improves behavior by training only what a model would say if interrupted and asked
    to reflect. These results indicate that language models maintain a small, privileged set of representations
    bearing some of the functional hallmarks of conscious access, and that decoding these representations
    sheds light on ongoing cognitive processes.'
