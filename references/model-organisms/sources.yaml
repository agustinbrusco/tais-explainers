  notes: ''
- id: arxiv:2406.10162
  title: 'Sycophancy to Subterfuge: Investigating Reward-Tampering in Large Language Models'
  authors:
  - Carson Denison
  - Monte MacDiarmid
  - Fazl Barez
  - David Duvenaud
  - Shauna Kravec
  - Samuel Marks
  - Nicholas Schiefer
  - Ryan Soklaski
  - Alex Tamkin
  - Jared Kaplan
  - Buck Shlegeris
  - Samuel R. Bowman
  - Ethan Perez
  - Evan Hubinger
  date: '2024-06-14'
  url: https://arxiv.org/abs/2406.10162
  abstract: In reinforcement learning, specification gaming occurs when AI systems learn undesired behaviors
    that are highly rewarded due to misspecified training goals. Specification gaming can range from simple
    behaviors like sycophancy to sophisticated and pernicious behaviors like reward-tampering, where a
    model directly modifies its own reward mechanism. However, these more pernicious behaviors may be
    too complex to be discovered via exploration. In this paper, we study whether Large Language Model
    (LLM) assistants which find easily discovered forms of specification gaming will generalize to perform
    rarer and more blatant forms, up to and including reward-tampering. We construct a curriculum of increasingly
    sophisticated gameable environments and find that training on early-curriculum environments leads
    to more specification gaming on remaining environments. Strikingly, a small but non-negligible proportion
    of the time, LLM assistants trained on the full curriculum generalize zero-shot to directly rewriting
    their own reward function. Retraining an LLM not to game early-curriculum environments mitigates,
    but does not eliminate, reward-tampering in later environments. Moreover, adding harmlessness training
    to our gameable environments does not prevent reward-tampering. These results demonstrate that LLMs
    can generalize from common forms of specification gaming to more pernicious reward tampering and that
    such behavior may be nontrivial to remove.
